<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#fafdff"/>
      <stop offset="100%" stop-color="#f0f7f3"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f3d20" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="pineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e7e43"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="redVelvet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#cardBg)"/>
  
  <g fill="#e0eee6" opacity="0.6">
    <circle cx="45" cy="60" r="2"/>
    <circle cx="85" cy="110" r="1.5"/>
    <circle cx="340" cy="70" r="2.5"/>
    <circle cx="370" cy="140" r="1.5"/>
    <circle cx="30" cy="220" r="2"/>
    <circle cx="360" cy="280" r="2"/>
    <circle cx="60" cy="380" r="1.5"/>
    <circle cx="330" cy="420" r="2"/>
  </g>
  
  <ellipse cx="200" cy="445" rx="100" ry="14" fill="#0f3d20" opacity="0.08"/>
  
  
    <ellipse cx="200" cy="435" rx="50" ry="14" fill="#a16207" opacity="0.3"/>
    <path d="M160 380 Q150 430 170 435 Q200 440 230 435 Q250 430 240 380 Z" fill="#d97706"/>
    <rect x="165" y="380" width="70" height="12" rx="3" fill="url(#redVelvet)"/>
    <ellipse cx="200" cy="386" rx="8" ry="7" fill="#991b1b"/>
    <path d="M195 390 L185 415 M205 390 L215 415" stroke="url(#redVelvet)" stroke-width="4" stroke-linecap="round"/>
    <g filter="url(#dropShadow)">
      <path d="M200 230 L125 385 Q200 405 275 385 Z" fill="#14532d"/>
      <path d="M200 150 L145 260 Q200 275 255 260 Z" fill="#166534"/>
      <path d="M200 90 L160 170 Q200 182 240 170 Z" fill="#15803d"/>
    </g>
    <g fill="#fef08a" filter="url(#softGlow)">
      <circle cx="185" cy="135" r="3"/>
      <circle cx="215" cy="150" r="3"/>
      <circle cx="170" cy="200" r="3.5"/>
      <circle cx="225" cy="220" r="3.5"/>
      <circle cx="190" cy="240" r="3.5"/>
      <circle cx="150" cy="310" r="4"/>
      <circle cx="240" cy="320" r="4"/>
      <circle cx="200" cy="335" r="4"/>
      <circle cx="165" cy="365" r="4"/>
      <circle cx="230" cy="370" r="4"/>
    </g>
    <polygon points="200,65 204,78 217,78 207,85 210,98 200,90 190,98 193,85 183,78 196,78" fill="url(#gold)"/>
  
</svg>