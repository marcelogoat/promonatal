<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#fafdff"/>
      <stop offset="100%" stop-color="#f0f7f3"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f3d20" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="pineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e7e43"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="redVelvet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#cardBg)"/>
  
  <g fill="#e0eee6" opacity="0.6">
    <circle cx="45" cy="60" r="2"/>
    <circle cx="85" cy="110" r="1.5"/>
    <circle cx="340" cy="70" r="2.5"/>
    <circle cx="370" cy="140" r="1.5"/>
    <circle cx="30" cy="220" r="2"/>
    <circle cx="360" cy="280" r="2"/>
    <circle cx="60" cy="380" r="1.5"/>
    <circle cx="330" cy="420" r="2"/>
  </g>
  
  <ellipse cx="200" cy="445" rx="100" ry="14" fill="#0f3d20" opacity="0.08"/>
  
  
    <path d="M120 400 Q200 380 280 400" stroke="#166534" stroke-width="12" stroke-linecap="round"/>
    <rect x="135" y="380" width="130" height="14" rx="6" fill="#78350f" transform="rotate(-6 135 380)"/>
    <rect x="140" y="395" width="120" height="12" rx="5" fill="#582404" transform="rotate(3 140 395)"/>
    <g filter="url(#dropShadow)">
      <rect x="145" y="210" width="110" height="160" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <rect x="150" y="240" width="100" height="125" rx="10" fill="url(#redVelvet)"/>
      <rect x="165" y="270" width="70" height="60" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="200" y="295" font-family="'Manrope', sans-serif" font-size="9" font-weight="bold" fill="#991b1b" text-anchor="middle">ENCANTO</text>
      <text x="200" y="310" font-family="'Manrope', sans-serif" font-size="7" fill="#78350f" text-anchor="middle">Canela &amp; Maçã</text>
    </g>
    <rect x="198" y="222" width="4" height="20" fill="#1e293b"/>
    <circle cx="200" cy="195" r="35" fill="url(#starGlow)"/>
    <path d="M200 170 C215 190 212 210 200 222 C188 210 185 190 200 170 Z" fill="url(#gold)" filter="url(#softGlow)"/>
    <path d="M200 188 C206 198 205 208 200 215 C195 208 194 198 200 188 Z" fill="#ffffff"/>
  
</svg>