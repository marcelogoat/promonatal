<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#fafdff"/>
      <stop offset="100%" stop-color="#f0f7f3"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f3d20" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="pineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e7e43"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="redVelvet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#cardBg)"/>
  
  <g fill="#e0eee6" opacity="0.6">
    <circle cx="45" cy="60" r="2"/>
    <circle cx="85" cy="110" r="1.5"/>
    <circle cx="340" cy="70" r="2.5"/>
    <circle cx="370" cy="140" r="1.5"/>
    <circle cx="30" cy="220" r="2"/>
    <circle cx="360" cy="280" r="2"/>
    <circle cx="60" cy="380" r="1.5"/>
    <circle cx="330" cy="420" r="2"/>
  </g>
  
  <ellipse cx="200" cy="445" rx="100" ry="14" fill="#0f3d20" opacity="0.08"/>
  
  
    <path d="M120 290 L140 430 Q200 445 260 430 L280 290 Z" fill="#b45309" stroke="#78350f" stroke-width="3"/>
    <path d="M130 330 Q200 345 270 330 M135 375 Q200 390 265 375 M140 410 Q200 420 260 410" stroke="#78350f" stroke-width="2" fill="none"/>
    <g filter="url(#dropShadow)">
      <rect x="210" y="140" width="40" height="150" rx="10" fill="#064e3b" transform="rotate(12 210 140)"/>
      <rect x="220" y="110" width="18" height="40" rx="3" fill="#064e3b" transform="rotate(12 210 140)"/>
      <rect x="218" y="105" width="22" height="15" rx="2" fill="url(#gold)" transform="rotate(12 210 140)"/>
      <path d="M135 240 Q175 190 215 240 L210 290 L140 290 Z" fill="#d97706"/>
      <path d="M135 240 Q175 190 215 240 Z" fill="#92400e"/>
      <rect x="135" y="260" width="80" height="25" fill="url(#redVelvet)"/>
      <path d="M120 270 Q160 250 200 270" stroke="#16a34a" stroke-width="12" stroke-linecap="round"/>
      <circle cx="170" cy="275" r="14" fill="url(#gold)"/>
      <circle cx="245" cy="285" r="12" fill="url(#redVelvet)"/>
    </g>
    <g filter="url(#dropShadow)">
      <ellipse cx="180" cy="300" rx="18" ry="12" fill="url(#gold)"/>
      <ellipse cx="220" cy="300" rx="18" ry="12" fill="url(#gold)"/>
      <circle cx="200" cy="302" r="10" fill="#b45309"/>
      <path d="M195 310 L180 350 M205 310 L220 350" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    </g>
  
</svg>