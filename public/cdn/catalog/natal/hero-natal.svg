<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#fafdff"/>
      <stop offset="100%" stop-color="#f0f7f3"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f3d20" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="pineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e7e43"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="redVelvet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#cardBg)"/>
  
  <g fill="#e0eee6" opacity="0.6">
    <circle cx="45" cy="60" r="2"/>
    <circle cx="85" cy="110" r="1.5"/>
    <circle cx="340" cy="70" r="2.5"/>
    <circle cx="370" cy="140" r="1.5"/>
    <circle cx="30" cy="220" r="2"/>
    <circle cx="360" cy="280" r="2"/>
    <circle cx="60" cy="380" r="1.5"/>
    <circle cx="330" cy="420" r="2"/>
  </g>
  
  <ellipse cx="200" cy="445" rx="100" ry="14" fill="#0f3d20" opacity="0.08"/>
  
  
    <g filter="url(#dropShadow)">
      <ellipse cx="200" cy="425" rx="90" ry="20" fill="url(#redVelvet)" stroke="url(#gold)" stroke-width="2"/>
      <rect x="190" y="380" width="20" height="30" fill="#713f12"/>
      <path d="M200 240 L85 390 Q200 415 315 390 Z" fill="url(#pineGrad)"/>
      <path d="M115 385 Q200 405 285 385" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
      <path d="M200 170 L110 280 Q200 300 290 280 Z" fill="url(#pineGrad)"/>
      <path d="M135 275 Q200 292 265 275" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
      <path d="M200 100 L135 195 Q200 215 265 195 Z" fill="url(#pineGrad)"/>
      <path d="M150 190 Q200 205 250 190" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <path d="M200 45 L155 120 Q200 135 245 120 Z" fill="url(#pineGrad)"/>
    </g>
    <path d="M180 85 Q215 110 190 140 Q160 175 225 210 Q160 255 240 305 Q140 355 260 385" fill="none" stroke="url(#gold)" stroke-width="3" stroke-dasharray="2 7"/>
    <g filter="url(#dropShadow)">
      <circle cx="180" cy="140" r="8" fill="url(#redVelvet)"/>
      <circle cx="215" cy="175" r="9" fill="url(#gold)"/>
      <circle cx="165" cy="225" r="9" fill="url(#redVelvet)"/>
      <circle cx="230" cy="250" r="10" fill="url(#gold)"/>
      <circle cx="150" cy="320" r="11" fill="url(#gold)"/>
      <circle cx="205" cy="335" r="11" fill="url(#redVelvet)"/>
      <circle cx="255" cy="340" r="10" fill="url(#gold)"/>
    </g>
    <circle cx="200" cy="40" r="35" fill="url(#starGlow)"/>
    <polygon points="200,15 207,35 228,35 211,48 217,68 200,55 183,68 189,48 172,35 193,35" fill="url(#gold)" filter="url(#softGlow)"/>
    <g filter="url(#dropShadow)">
      <rect x="95" y="390" width="50" height="42" rx="4" fill="url(#redVelvet)"/>
      <rect x="117" y="390" width="8" height="42" fill="url(#gold)"/>
      <rect x="95" y="407" width="50" height="8" fill="url(#gold)"/>
      <circle cx="121" cy="388" r="6" fill="url(#gold)"/>
      <rect x="155" y="405" width="46" height="35" rx="4" fill="url(#gold)"/>
      <rect x="174" y="405" width="8" height="35" fill="url(#redVelvet)"/>
      <circle cx="178" cy="403" r="5" fill="url(#redVelvet)"/>
      <rect x="250" y="395" width="48" height="38" rx="4" fill="#047857"/>
      <rect x="270" y="395" width="8" height="38" fill="url(#gold)"/>
      <rect x="250" y="410" width="48" height="8" fill="url(#gold)"/>
      <circle cx="274" cy="393" r="5" fill="url(#gold)"/>
    </g>
  
</svg>