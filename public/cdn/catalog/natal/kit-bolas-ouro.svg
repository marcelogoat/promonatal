<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#fafdff"/>
      <stop offset="100%" stop-color="#f0f7f3"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f3d20" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="pineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e7e43"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="redVelvet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#cardBg)"/>
  
  <g fill="#e0eee6" opacity="0.6">
    <circle cx="45" cy="60" r="2"/>
    <circle cx="85" cy="110" r="1.5"/>
    <circle cx="340" cy="70" r="2.5"/>
    <circle cx="370" cy="140" r="1.5"/>
    <circle cx="30" cy="220" r="2"/>
    <circle cx="360" cy="280" r="2"/>
    <circle cx="60" cy="380" r="1.5"/>
    <circle cx="330" cy="420" r="2"/>
  </g>
  
  <ellipse cx="200" cy="445" rx="100" ry="14" fill="#0f3d20" opacity="0.08"/>
  
  
    <g filter="url(#dropShadow)">
      <circle cx="160" cy="220" r="48" fill="url(#gold)"/>
      <rect x="152" y="162" width="16" height="12" rx="3" fill="#b45309"/>
      <circle cx="160" cy="162" r="5" fill="none" stroke="#b45309" stroke-width="2"/>
      <path d="M125 220 Q160 250 195 220" stroke="#ffffff" stroke-width="4" stroke-dasharray="3 5" fill="none"/>
      
      <circle cx="240" cy="290" r="45" fill="url(#redVelvet)"/>
      <rect x="232" y="235" width="16" height="12" rx="3" fill="url(#gold)"/>
      <circle cx="240" cy="235" r="5" fill="none" stroke="url(#gold)" stroke-width="2"/>
      <path d="M208 290 Q240 320 272 290" stroke="url(#gold)" stroke-width="3" fill="none"/>

      <circle cx="150" cy="350" r="40" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <rect x="142" y="300" width="16" height="12" rx="3" fill="url(#gold)"/>
      <path d="M120 350 Q150 375 180 350" stroke="#047857" stroke-width="3" stroke-dasharray="3 4" fill="none"/>
    </g>
  
</svg>